<style>
:root {
  --paper: #f3ead8; --shade: #e6d8bc; --ink: #2b2a33; --stamp: #b5453a;
  --tide: #2f7f7a; --deep: #1d3b52; --gold: #ffcf6b; --muted: #6b5c49;
  --edge: rgba(43, 42, 51, 0.22); --lift: 0 6px 18px rgba(16, 22, 40, 0.22);
}
html, body { margin: 0; height: 100%; background: #0b1030; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: 'Shantell Sans', system-ui, sans-serif; color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: inherit; color: var(--ink); cursor: pointer; pointer-events: auto; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.hud {
  position: fixed; inset: 0; pointer-events: none; box-sizing: border-box;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; justify-content: space-between;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.chip {
  height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
  background: rgba(250, 244, 230, 0.94); border: 1.5px solid var(--edge); border-radius: 999px; box-sizing: border-box;
  box-shadow: var(--lift); font-size: 16px; font-weight: 600; white-space: nowrap;
}
.chip .small { font-family: inherit; font-style: italic; font-weight: 500; font-size: 15px; color: var(--muted); }
.chip svg { flex-shrink: 0; }
.topleft { display: flex; gap: 10px; align-items: center; min-width: 0; }
.iconbtn {
  width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0;
  border-radius: 50%; border: 1px solid rgba(43, 42, 51, 0.16); background: rgba(250, 244, 230, 0.82); color: var(--ink);
  box-shadow: 0 3px 10px rgba(16, 22, 40, 0.18); text-decoration: none; pointer-events: auto;
}
.iconbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.clock {
  display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap;
  color: rgba(43, 42, 51, 0.78); text-shadow: 0 1px 2px rgba(255, 255, 255, 0.55);
}
.clock.dark { color: rgba(246, 240, 226, 0.9); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5); }
.clock svg { width: 15px; height: 15px; }
.topwrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.topwrap .top { align-self: stretch; }
.dinner { height: 40px; font-size: 15px; gap: 8px; }
.pips { display: flex; gap: 4px; }
.pip { width: 12px; height: 12px; box-sizing: border-box; border: 1.5px solid #b9a787; border-radius: 50%; background: var(--shade); }
.pip.on { background: #e0703a; border-color: #a9502a; }
.panel {
  align-self: center; width: min(100%, 360px); box-sizing: border-box; padding: 14px 16px;
  background: rgba(250, 244, 230, 0.94); border: 1.5px solid var(--edge); border-radius: 18px; box-shadow: var(--lift);
  display: flex; flex-direction: column; gap: 10px;
}
@media (orientation: landscape) and (max-height: 520px) {
  .panel { align-self: flex-end; width: 300px; }
}
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.label { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.panel .small { font-family: inherit; font-style: italic; font-weight: 500; font-size: 15px; color: var(--muted); }
.small { font-family: 'Courier Prime', monospace; font-size: 14px; font-weight: 700; }
.msg { margin: 0; font-family: 'Kalam', cursive; font-size: 19px; line-height: 1.3; text-align: center; color: #3d3a40; }
.meter { position: relative; height: 18px; border: 1.5px solid rgba(43, 42, 51, 0.4); border-radius: 999px; background: var(--shade); box-sizing: border-box; overflow: visible; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tide); border-radius: 999px; }
.meter .zone { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
.meter .mark { position: absolute; top: -7px; width: 6px; height: 29px; margin-left: -3px; background: var(--ink); border-radius: 3px; box-shadow: 0 0 0 2px rgba(250, 244, 230, 0.9); }
[hidden] { display: none !important; }

.overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(8, 12, 32, 0.55); pointer-events: auto; padding: 16px; box-sizing: border-box;
}
.card {
  position: relative; width: min(100%, 360px); max-height: 100%; overflow: auto; box-sizing: border-box;
  background: var(--paper); border: 1.5px solid var(--edge); border-radius: 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
  padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 12px;
  font-family: 'Courier Prime', monospace;
}
.stamp {
  position: absolute; top: 10px; right: 14px; padding: 4px 10px; border: 3px solid var(--stamp); color: var(--stamp);
  background: var(--paper); border-radius: 6px; font-family: 'Shantell Sans', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 1.5px; transform: rotate(6deg);
}
.sketch {
  height: 180px; border: 2px dashed var(--stamp); border-radius: 12px; display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 10px; box-sizing: border-box; font-family: 'Kalam', cursive; font-size: 18px; color: var(--stamp);
}
.sketch.art { border: none; padding: 0; }
.sketch.gold:not(.art) { border-color: #c99a2e; color: #a87a12; }
.small-sketch { height: 140px; }
.goldstamp { border-color: #c99a2e !important; color: #a87a12 !important; }
.fightnote { font-family: 'Kalam', cursive; font-size: 17px; color: var(--deep); }
.slot { position: relative; }
.slot.odd { background: #f4efe3; }
.slot.odd .no { color: #8a6f4a; font-style: italic; }
.goldmark { position: absolute; top: 6px; right: 8px; color: #d9a521; font-size: 16px; text-shadow: 0 1px 0 #8a6510; }
.sketch.art img, .slot .mini img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.fishname { margin: 0; font-family: 'Kalam', cursive; font-weight: 700; font-size: 30px; line-height: 1.1; color: var(--deep); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; font-weight: 700; }
.note { margin: 0; font-family: 'Kalam', cursive; font-size: 19px; line-height: 1.35; color: #3d3a40; }
.btn {
  min-height: 52px; border: 1.5px solid rgba(43, 42, 51, 0.45); border-radius: 14px; box-shadow: 0 4px 0 rgba(43, 42, 51, 0.35); background: var(--paper);
  font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
}
.btn.primary { background: var(--gold); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43, 42, 51, 0.35); }

.journal {
  position: fixed; inset: 0; background: var(--paper); pointer-events: auto; overflow: auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 32px; box-sizing: border-box; font-family: 'Courier Prime', monospace;
}
.jhead { display: flex; align-items: center; gap: 14px; max-width: 640px; margin: 0 auto; }
.jhead h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; color: var(--deep); font-family: 'Shantell Sans', sans-serif; font-weight: 700; }
.sq { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 1.5px solid rgba(43, 42, 51, 0.45); border-radius: 50%; padding: 0; }
.grid { max-width: 640px; margin: 18px auto 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.slot {
  min-height: 120px; padding: 8px; box-sizing: border-box; border: 1.5px solid var(--edge); border-radius: 12px; background: #fbf6ea; box-shadow: 0 2px 6px rgba(43, 42, 51, 0.08);
  display: flex; flex-direction: column; gap: 4px; text-align: left; font-family: 'Courier Prime', monospace;
}
.slot .mini.art { border: none; }
.slot .mini { flex-grow: 1; min-height: 40px; border: 1.5px dashed #c98d84; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Kalam', cursive; font-size: 13px; color: var(--stamp); }
.slot.missing { background: var(--shade); border-style: dashed; border-color: #b9a787; box-shadow: none; align-items: center; justify-content: center; text-align: center; cursor: default; }
.slot .q { font-family: 'Shantell Sans', sans-serif; font-size: 30px; font-weight: 700; color: #a8956f; }
.slot .no { font-size: 11px; color: var(--muted); }
.slot .nm { font-family: 'Kalam', cursive; font-size: 15px; font-weight: 700; line-height: 1.05; }
.slot .hint { font-family: 'Kalam', cursive; font-size: 14px; color: #5a4a3a; }
.detail { max-width: 520px; margin: 18px auto 0; display: flex; flex-direction: column; gap: 12px; }
.detail .sketch { height: 240px; }

.debug {
  position: fixed; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; pointer-events: auto;
  font-family: 'Courier Prime', monospace; font-size: 12px; background: rgba(0,0,0,0.6); padding: 6px; color: #fff;
}
.debug button { font-size: 12px; padding: 4px 6px; min-height: 28px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Walter, a tuxedo cat, fishing off the end of a pier" role="img"></canvas>

<div class="hud">
  <div class="topwrap">
  <div class="top">
    <div class="topleft">
    <a class="iconbtn" href="https://games.shauna.digital/" aria-label="Back to all games">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="clock" id="clock"><span id="clockIcon"></span><span id="clockText">DAY 1 · 2:00 PM</span></div>
    </div>
    <button class="iconbtn" id="journalBtn" aria-label="Open journal">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C9.5 5 6 4.6 3 5.3v13c3-.7 6.5-.3 9 1.2 2.5-1.5 6-1.9 9-1.2v-13c-3-.7-6.5-.3-9 1.2z"/><path d="M12 6.5v13"/></svg>
      <span id="foundCount" hidden>0/15</span>
    </button>
  </div>
  <div class="chip dinner" id="dinnerChip" hidden><span id="dinnerLabel">DINNER</span><span class="pips" id="dinnerPips"></span><span class="small" id="dinnerRight">by 8 PM</span></div>
  </div>
  <div class="panel" id="panel">
    <div class="row" id="meterRow" hidden><span class="label" id="meterLabel">CAST POWER</span><span class="small" id="meterRight"></span></div>
    <div class="meter" id="meter" hidden>
      <div class="zone" id="zoneSweet" style="background:#7fbfb5"></div>
      <div class="zone" id="zoneSnap" style="background:#d98a7f"></div>
      <div class="fill" id="meterFill"></div>
      <div class="mark" id="meterMark" hidden></div>
    </div>
    <p class="msg" id="msg">Hold anywhere to wind up. Let go to cast.</p>
  </div>
</div>

<div class="overlay" id="catchOverlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="catchName">
    <div class="stamp" id="catchStamp">NEW ENTRY</div>
    <div class="row small" style="color:var(--muted)"><span id="catchNo">No. 001</span><span id="catchWhen"></span></div>
    <div class="sketch" id="catchSketch">[Drawing coming soon]</div>
    <h2 class="fishname" id="catchName">Pier Perch</h2>
    <div class="facts" id="catchFacts"></div>
    <p class="note" id="catchNote"></p>
    <button class="btn primary" id="keepFishing">KEEP FISHING</button>
    <button class="btn" id="catchToJournal">OPEN JOURNAL</button>
  </div>
</div>

<div class="journal" id="journal" hidden>
  <div class="jhead">
    <button class="sq" id="journalBack" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div>
      <h1 id="journalTitle">WALTER'S TIDEBOOK</h1>
      <div class="small" style="color:var(--muted)" id="journalSub"></div>
    </div>
  </div>
  <div class="grid" id="journalGrid"></div>
  <div class="detail" id="journalDetail" hidden></div>
</div>

<div class="debug" id="debug" hidden></div>

<script>
'use strict';

/* ---------- Tuning knobs ---------- */
const TUNE = {
  // The clock follows the player's real local time. Day 1 is the day they first played.
  chargeTime: 1.1,         // seconds for the power bar to go from empty to full (then it falls back)
  flightTime: 0.7,         // seconds the bobber is in the air
  waitMin: 2.5,            // seconds before a bite, at least
  waitMax: 7,              // and at most
  nibbleChance: 0.6,       // chance of fake nibbles before the real bite
  biteWindow: 0.9,         // seconds to tap after the bobber dips
  reelSpeed: 2.4,          // meters per second while holding
  sweetBonus: 1.5,         // reel speed multiplier inside the sweet zone
  strengthDrag: 0.25,      // how much a strong fish slows your reeling
  tireTime: 18,            // seconds for a fish to tire to half strength
  tensionUp: 0.55,         // tension per second while holding (scaled by fish strength)
  tensionDown: 0.7,        // tension per second while not holding
  surgeEvery: [1.2, 3],    // seconds between fish surges
  surgePower: 1.8,         // extra tension per second during a surge (times strength)
  surgeLength: 0.45,
  pullOut: 0.9,            // meters per second a fish takes when you are not reeling (times strength)
  slackEscape: 2.2,        // seconds of slack line before the fish gets away
  sweet: [0.3, 0.68],      // sweet zone on the tension bar for common fish (see sweetZone)
  sweetWidth: { Common: 0.38, Uncommon: 0.32, Rare: 0.26, Legendary: 0.2, 'Odds and Ends': 0.44 },
  rainChance: 0.3,         // chance each new game day is rainy
  dailyBoost: 3,           // today's fish is this many times more likely
  dinnerGoal: 4,           // dinner points Walter needs each evening
  dinnerStart: 6,          // dinner window opens (game hour)
  dinnerHour: 20,          // and closes: catch enough by 8 PM
};

/* ---------- Fish ---------- */
// time: any | day | dusk | night   depth: any | near | mid | far   weather: any | rain
// fight: how it pulls on the line, see FIGHTS below
const FISH = [
  { id: 1,  name: 'Pier Perch',          time: 'any',   depth: 'any',  w: 10,  size: [12, 25],  str: 0.2,  rarity: 'Common', fight: 'steady',    note: 'Tastes like pier. Would eat again.', hint: 'anytime' },
  { id: 2,  name: 'Sulky Sardine',       time: 'day',   depth: 'near', w: 8,   size: [8, 15],   str: 0.15, rarity: 'Common', fight: 'sulk',    note: 'Sighed when caught. Small, but dinner is dinner.', hint: 'daytime, close in' },
  { id: 3,  name: 'Drizzle Darter',      time: 'any',   depth: 'any',  w: 6,   size: [14, 22],  str: 0.3,  rarity: 'Uncommon', fight: 'dart',  note: 'Only comes up in the rain. I hate the rain. Worth it.', hint: 'rainy days', weather: 'rain' },
  { id: 4,  name: 'Bucket Crab',         time: 'any',   depth: 'near', w: 7,   size: [10, 18],  str: 0.25, rarity: 'Common', fight: 'dart',    note: 'Not a fish. Pinched my nose. Not eating it.', hint: 'close to the pier', refuse: true },
  { id: 5,  name: 'Gull Snack',          time: 'day',   depth: 'mid',  w: 6,   size: [15, 22],  str: 0.2,  rarity: 'Common', fight: 'steady',    note: 'The gulls wanted this one. Too bad, gulls.', hint: 'daytime' },
  { id: 6,  name: 'Dusky Flounder',      time: 'dusk',  depth: 'any',  w: 5,   size: [30, 45],  str: 0.4,  rarity: 'Uncommon', fight: 'heavy',  note: 'Flat. Judgy. Delicious.', hint: 'dusk only' },
  { id: 7,  name: 'Grumble Grouper',     time: 'any',   depth: 'mid',  w: 4,   size: [35, 55],  str: 0.55, rarity: 'Uncommon', fight: 'grumble',  note: 'Grumbled the whole way up. So did I.', hint: 'a medium cast' },
  { id: 8,  name: 'Lamplight Grouper',   time: 'night', depth: 'near', w: 3,   size: [40, 60],  str: 0.5,  rarity: 'Rare', fight: 'grumble',      note: 'Only bites when the lamp is on. Looked personally offended to be caught.', hint: 'night, under the lamp' },
  { id: 9,  name: 'Longline Tuna',       time: 'any',   depth: 'far',  w: 3,   size: [60, 90],  str: 0.75, rarity: 'Rare', fight: 'run',      note: 'Needed all four paws. Dinner for a week.', hint: 'cast far' },
  { id: 10, name: 'Sock Eel',            time: 'night', depth: 'mid',  w: 4,   size: [30, 70],  str: 0.45, rarity: 'Uncommon', fight: 'wriggle',  note: 'Looks like a lost sock. Tastes slightly better.', hint: 'night' },
  { id: 11, name: 'Lanternfish',         time: 'night', depth: 'far',  w: 2,   size: [20, 30],  str: 0.5,  rarity: 'Rare', fight: 'dart',      note: 'Brought its own light. Too pretty to eat.', hint: 'night, far out', refuse: true },
  { id: 12, name: 'Tiny Admiral',        time: 'day',   depth: 'any',  w: 2,   size: [5, 8],    str: 0.1,  rarity: 'Rare', fight: 'steady',      note: 'Wears a hat. Respect. Let it go.', hint: 'daytime, if lucky', refuse: true },
  { id: 13, name: 'Sunday Snapper',      time: 'any',   depth: 'any',  w: 4,   size: [25, 40],  str: 0.4,  rarity: 'Rare', fight: 'steady',      note: 'Only shows up on Sundays. Dressed for it. So was I.', hint: 'Sundays', sunday: true },
  { id: 14, name: 'Old Boot Bass',       time: 'dusk',  depth: 'far',  w: 0.6, size: [70, 100], str: 0.9,  rarity: 'Legendary', fight: 'heavy', note: 'Might be a boot. Did not eat.', hint: 'legendary', refuse: true },
  { id: 15, name: 'The Pier Ghost',      time: 'night', depth: 'far',  w: 0.4, size: [80, 120], str: 0.95, rarity: 'Legendary', fight: 'ghost', note: 'Nobody believes me. Not eating a ghost.', hint: 'legendary', weather: 'rain', refuse: true },
  // Odds and ends: not fish. Mixed into the journal with their own tag, counted apart from the fish.
  { id: 101, name: 'Message in a Bottle', time: 'any', depth: 'any', w: 1.2, size: [20, 30], str: 0.12, rarity: 'Odds and Ends', fight: 'junk', junk: true, refuse: true, note: 'Not dinner. There was a note inside, though.', hint: 'something bobbing out there' },
  { id: 102, name: 'Torn Map',            time: 'any', depth: 'any', w: 0.9, size: [14, 20], str: 0.1,  rarity: 'Odds and Ends', fight: 'junk', junk: true, refuse: true, map: true, note: 'Part of a map. The X is on another piece. Obviously.', hint: 'soggy paper, somewhere' },
  { id: 103, name: 'Rubber Duck',         time: 'any', depth: 'any', w: 1.0, size: [8, 12],  str: 0.1,  rarity: 'Odds and Ends', fight: 'junk', junk: true, refuse: true, note: 'It squeaked at me. We are not friends.', hint: 'something yellow' },
  { id: 104, name: 'Empty Sardine Tin',   time: 'any', depth: 'near', w: 1.2, size: [10, 12], str: 0.1, rarity: 'Odds and Ends', fight: 'junk', junk: true, refuse: true, note: 'Empty. Someone ate them. I am furious.', hint: 'something shiny, close in' },
  { id: 105, name: 'Single Flip-flop',    time: 'any', depth: 'any', w: 1.2, size: [22, 28], str: 0.12, rarity: 'Odds and Ends', fight: 'junk', junk: true, refuse: true, note: 'One shoe. Where is the other one? Where is the person?', hint: 'something floppy' },
  { id: 106, name: 'Sunken Chest',        time: 'any', depth: 'far', w: 1.0, size: [40, 60], str: 0.55, rarity: 'Odds and Ends', fight: 'heavy', junk: true, refuse: true, chest: true, note: 'Full of sand and one gold coin. I feel lucky now.', hint: 'follow the map' },
];

// Shauna's fish paintings (art/fish/). Fish without one yet show the dashed placeholder.
const FISH_ART = { 1: 'fish-001-pier-perch', 2: 'fish-002-sulky-sardine', 3: 'fish-003-drizzle-darter', 4: 'fish-004-bucket-crab', 5: 'fish-005-gull-snack', 6: 'fish-006-dusky-flounder',

/* ---------- Save ---------- */
const SAVE_KEY = 'saltwhisker.save';

/* ---------- Helpers ---------- */

function clockGm() { const d = new Date(); return daysSince(SAVE.start) * 1440 + d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + CLOCK.offset; }

const DAILY = dailyFishId();

const PAL = {

  dusk:  { top: '#433a78', bot: '#f6a463', sun: '#ffd38a', sunY: 30,  sea: '#5b5a93', seaDeep: '#413f74', seaDeeper: '#2b2a55', wave: '#f3b88f', wood: '#64402e', woodLight: '#93603f', woodDark: '#3f271a', post: '#2e1c13', cloud: '#f7b99a', land: '#3d3560', line: '#fbe7d4', stars: 0.35, glow: 0.12, gull: 1, glint: 0.8,  shadow: 0.25, tint: '#d9a39c' },
  night: { top: '#0b1030', bot: '#26365f', sun: '#f4e9c1', sunY: -12, sea: '#17324f', seaDeep: '#10253d', seaDeeper: '#0a182a', wave: '#55779f', wood: '#3e2d2b', woodLight: '#5d443b', woodDark: '#271b1a', post: '#1c1313', cloud: '#2f3c66', land: '#141b38', line: '#c9d6ea', stars: 1,    glow: 0.2,  gull: 0, glint: 0.35, shadow: 0.35, tint: '#6a77a6' },
};
const KEYS = [[0, 'night'], [5, 'night'], [7, 'day'], [16.5, 'day'], [18.5, 'dusk'], [20, 'night'], [24, 'night']];
function hourOf(gm) { return (gm / 60) % 24; }
function dayOf(gm) { return Math.floor(gm / 1440) + 1; }
function periodOf(h) { return h >= 6 && h < 17.5 ? 'day' : h >= 17.5 && h < 19.5 ? 'dusk' : 'night'; }

  let i = 0; while (i < KEYS.length - 2 && h >= KEYS[i + 1][0]) i++;
  const [h0, p0] = KEYS[i], [h1, p1] = KEYS[i + 1];
  const t = h1 === h0 ? 0 : clamp((h - h0) / (h1 - h0), 0, 1);
  const A = PAL[p0], B = PAL[p1], out = {};
  for (const k in A) out[k] = typeof A[k] === 'number' ? lerp(A[k], B[k], t) : mixHex(A[k], B[k], t);

/* ---------- Canvas ---------- */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const CAM = { x: 78, y: 52, w: 72, h: 72, maxScale: 9 };   // focus box in world pixels: smaller = more zoomed in
let W = 0, H = 0, DPR = 1, SC = 1, OX = 0, OY = 0, VW = 200, VH = 200;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  // Camera: always show the whole focus box (cat, rod, bobber, near water) as big as it fits,
  // and fill the rest of the screen with more of the world.
  SC = Math.min(W / CAM.w, H / CAM.h, CAM.maxScale);

/* ---------- Game state ---------- */
const TIP = { x: 132, y: 60 };     // rod tip at rest
const HAND = { x: 111.5, y: 79.5 };   // Walter's raised paw (moved each frame by the painted cat)
const CAT = { x: 96, y: 70 };
const S = {
  state: 'idle',       // idle | charging | flying | waiting | bite | reeling | caught | message
  t: 0,                // seconds in the current state
  power: 0,
  holding: false,
  bob: { x: 0, y: 0, tx: 0 },
  waitAt: 0, nibbles: [], lastNibble: -9,
  fish: null, depth: 'near',
  dist: 0, startDist: 0, tension: 0, slack: 0, surgeIn: 0, surgeLeft: 0,
  shadow: null,
  msgUntil: 0,
  shake: 0,
  splashes: [],
  rain: [],
  catches: 0, escapes: 0, snaps: 0,
};
function setState(s) { S.state = s; S.t = 0; }

function depthFromPower(p) { return p < 0.35 ? 'near' : p < 0.7 ? 'mid' : 'far'; }
function castRange() {
  const left = 120, right = Math.min(OX + VW - 8, 172);
  return [left, Math.max(left + 12, right)];
}
function isSunday() { return new Date().getDay() === 0; }
function pickFish() {
  const per = periodOf(hourOf(SAVE.gm));
  const pool = FISH.filter(f =>
    (f.time === 'any' || f.time === per) &&
    (f.depth === 'any' || f.depth === S.depth) &&
    (!f.weather || f.weather === SAVE.weather) &&
    (!f.sunday || isSunday()) &&
    (!f.map || (SAVE.mapPieces || 0) < 4) &&
    (!f.chest || ((SAVE.mapPieces || 0) >= 4 && !SAVE.found[f.id])));
  let total = 0;
  const ws = pool.map(f => { const w = f.w * (f.id === DAILY ? TUNE.dailyBoost : 1); total += w; return w; });
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}

/* ---------- Input ---------- */
function press() {
  if (S.holding) return;
  S.holding = true;
  switch (S.state) {
    case 'idle': case 'message':
      setState('charging'); S.power = 0; break;
    case 'waiting':
      if (S.t - S.lastNibble < 0.35) say('Too early! It swam off.', 1.6);
      else say('Reeled in. Nothing yet.', 1.2);
      break;
    case 'bite':
      hook(); break;
  }
}
function release() {
  if (!S.holding) return;
  S.holding = false;
  if (S.state === 'charging') cast();
}
function isUiTarget(e) { return e.target.closest && e.target.closest('a, button, .overlay, .journal, .debug'); }
window.addEventListener('pointerdown', e => { if (isUiTarget(e)) return; e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;

  e.preventDefault(); press();

/* ---------- Actions ---------- */
function say(text, secs) {
  setState('message'); S.msgUntil = secs; S.shadow = null; S.fish = null;
  ui.msg = text;
}
function cast() {
  const p = S.power;
  S.depth = depthFromPower(p);
  const [a, b] = castRange();
  S.bob.tx = lerp(a, b, p);
  S.bob.sx = TIP.x; S.bob.sy = TIP.y + 4;
  setState('flying');
}
function startWaiting() {
  setState('waiting');
  S.waitAt = rand(TUNE.waitMin, TUNE.waitMax);
  S.nibbles = [];
  if (Math.random() < TUNE.nibbleChance) {
    const n = 1 + (Math.random() < 0.4 ? 1 : 0);
    for (let i = 0; i < n; i++) S.nibbles.push(rand(S.waitAt * 0.45, S.waitAt - 0.6));
  }
  S.lastNibble = -9;
  S.fish = pickFish();
  S.gold = !S.fish.junk && Math.random() < goldChance();
  const fromLeft = Math.random() < 0.5;
  const sz = clamp(S.fish.size[1] / 10, 4, 14);
  S.shadow = { x: S.bob.x + (fromLeft ? -40 : 40), y: rand(112, 124), w: sz, show: false };
}
function hook() {
  setState('reeling');
  const f = S.fish;
  S.startDist = 5 + S.power * 15;
  S.dist = S.startDist;
  S.tension = 0.35; S.slack = 0;
  S.surgeIn = rand(TUNE.surgeEvery[0], TUNE.surgeEvery[1]); S.surgeLeft = 0;
  S.reelFrom = S.bob.x;
  S.fight = { t: 0, at: rand(0.4, 0.6) }; S.fightMsg = ''; S.ghostOut = false;
}
// One step of the fish's fight. Returns how it changes the pull this frame.
// The green part of the tension bar: narrower for rarer fish, drifting for wrigglers.
function sweetZone() {
  const f = S.fish, w = (f && TUNE.sweetWidth[f.rarity]) || (TUNE.sweet[1] - TUNE.sweet[0]);
  let c = (TUNE.sweet[0] + TUNE.sweet[1]) / 2;
  if (f && f.fight === 'wriggle' && S.fight) c += Math.sin(S.fight.t * 1.2) * 0.16;
  c = clamp(c, 0.06 + w / 2, 0.8 - w / 2);

}
function surgeCycle(o, dt, str, every, len, pow) {
  S.surgeIn -= dt;
  if (S.surgeIn <= 0) { S.surgeLeft = len; S.surgeIn = rand(every[0], every[1]); }
  if (S.surgeLeft > 0) { S.surgeLeft -= dt; o.surge = TUNE.surgePower * str * pow; }
}
function fightStep(dt, str) {
  const F = S.fight, style = S.fish.fight || 'steady';
  const o = { surge: 0, pull: 1, reel: 1, up: 1, extra: 0, ghost: false, msg: '' };
  F.t += dt;
  const progress = 1 - S.dist / S.startDist;
  const phase = (name, lo, hi) => { F.phase = name; F.until = F.t + rand(lo, hi); };
  const normal = [TUNE.surgeEvery, TUNE.surgeLength, 1];
  switch (style) {
    case 'dart': surgeCycle(o, dt, str, [0.45, 1], 0.22, 1.25); break;
    case 'junk': o.up = 0.6; o.pull = 0.3; if (F.t < 2.5) o.msg = 'Something on the line. Feels... floppy.'; break;
    case 'run':
      surgeCycle(o, dt, str, [2.8, 4.4], 1.2, 0.85);
      if (S.surgeLeft > 0) { o.pull = 2.4; o.msg = 'It is running! Ease off, let it go.'; }
      break;
    case 'heavy':
      o.reel = 0.72; o.up = 1.3; o.pull = 1.25;
      if (F.t < 2.5) o.msg = 'Heavy one. Keep it steady.';
      break;
    case 'wriggle':
      o.extra = Math.sin(F.t * 6.5) * 0.85 * (0.4 + str);
      surgeCycle(o, dt, str, [3, 5], 0.35, 0.8);
      if (F.t < 2.5) o.msg = 'It is wriggling! Ride the swings.';
      break;
    case 'sulk':
      if (!F.sulked && progress > F.at) { F.sulked = true; F.until = F.t + 1.8; }
      if (F.sulked && F.t < F.until) { o.up = 0.25; o.extra = -0.8; o.reel = 1.6; o.pull = 0; o.msg = 'It is sulking. Reel fast before it slips off!'; }

      break;

      if (!F.phase) phase('pull', 1.5, 2.6);
      if (F.t > F.until) { if (F.phase === 'pull') phase('grumble', 1.2, 2); else if (F.phase === 'grumble') phase('lunge', 0.6, 0.8); else phase('pull', 1.8, 3); }

      if (F.phase === 'lunge') { o.surge = TUNE.surgePower * str * 1.9; o.pull = 2.4; S.surgeLeft = 0.1; o.msg = 'Lunge! Ease off!'; }

      if (F.t > F.until) { if (F.phase === 'here') phase('gone', 1.2, 1.7); else phase('here', 2.2, 3.4); }
      if (F.phase === 'here') surgeCycle(o, dt, str, ...normal);

// The bottle's note: a tip about a fish Walter has not caught yet.
function bottleMessage() {
  const left = FISH.filter(f => isFish(f) && !SAVE.found[f.id] && f.rarity !== 'Legendary');
  if (!left.length) {
    const legend = FISH.find(f => f.rarity === 'Legendary' && !SAVE.found[f.id]);
    return legend ? 'Something big is out there. ' + (legend.weather ? 'Rainy nights, far out.' : 'Dusk, far out.') : 'You found everyone. Show off.';
  }
  const f = left[Math.floor(Math.random() * left.length)];

function landFish() {
  const f = S.fish;
  const size = Math.round(rand(f.size[0], f.size[1]));
  const rec = SAVE.found[f.id];
  const isNew = !rec;
  const isRecord = !isNew && size > rec.best;
  const gold = !!S.gold;
  let junkNote = '';
  if (f.map) {
    SAVE.mapPieces = Math.min(4, (SAVE.mapPieces || 0) + 1);
    junkNote = SAVE.mapPieces < 4 ? 'Piece ' + SAVE.mapPieces + ' of 4. ' + f.note
      : 'That is all four pieces. The X is far out past the pier. Cast far.';
  }
  if (f.chest) { SAVE.lucky = true; junkNote = f.note + ' (Golden fish now show up twice as often.)'; }
  if (f.id === 101) { SAVE.bottleNote = bottleMessage(); junkNote = f.note + ' It says: "' + SAVE.bottleNote + '"'; }
  if (isNew) SAVE.found[f.id] = { n: 1, best: size, first: todayISO() };
  else { rec.n++; if (isRecord) rec.best = size; }
  const r2 = SAVE.found[f.id], newGold = gold && !r2.gold;
  if (gold) r2.gold = (r2.gold || 0) + 1;
  let dinnerNote = '';
  const D = SAVE.dinner;
  if (f.junk) dinnerNote = 'Not food';
  else if (f.refuse) dinnerNote = 'Won\'t eat it';
  else if (!dinnerOpen(SAVE.gm)) dinnerNote = 'Midnight snack';
  else if (D.done) dinnerNote = 'Extra helping';
  else {
    const pts = dinnerPoints(size);
    D.pts = Math.min(TUNE.dinnerGoal, D.pts + pts);
    dinnerNote = '+' + pts + ' dinner';
    if (D.pts >= TUNE.dinnerGoal) { D.done = true; SAVE.streak++; SAVE.best = Math.max(SAVE.best, SAVE.streak); dinnerNote = 'Dinner served!'; }
  }
  persist();
  S.catches++;
  showCatch(f, size, isNew, isRecord && !f.junk, dinnerNote, gold, newGold, junkNote);

  S.shadow = null;

function lose(text, snap) {
  if (snap) { S.snaps++; S.shake = reduceMotion ? 0 : 0.35; } else S.escapes++;
  say(text, 1.8);

/* ---------- Dinner ---------- */
function dinnerKey(gm) { const h = hourOf(gm); return h >= TUNE.dinnerStart ? dayOf(gm) : dayOf(gm) - 1; }
function dinnerOpen(gm) { const h = hourOf(gm); return h >= TUNE.dinnerStart && h < TUNE.dinnerHour; }
function dinnerPoints(size) { return clamp(Math.round(size / 20), 1, 3); }
function tickDinner() {
  const k = dinnerKey(SAVE.gm), D = SAVE.dinner;
  if (D.key !== k) {
    // a missed dinner on a day the player was away still ends the streak
    if (!D.done && D.key && k - D.key >= 1 && !D.judged) SAVE.streak = 0;
    SAVE.dinner = { key: k, pts: 0, done: false, judged: false }; return;
  }
  if (dinnerOpen(SAVE.gm)) S.sawDinner = true;
  if (!D.judged && !dinnerOpen(SAVE.gm) && hourOf(SAVE.gm) >= TUNE.dinnerHour) {
    D.judged = true;
    if (!D.done) {
      SAVE.streak = 0;
      // only grumble if the player was here while dinner was still possible
      if (S.sawDinner && (S.state === 'idle' || S.state === 'message')) say('8 PM and no dinner. Walter sulks. Night fish are snacks only.', 3);
    }
    persist();
  }
}

/* ---------- Update ---------- */
let rainTimer = 0;
function update(dt) {
  S.t += dt;
  // clock
  SAVE.gm = clockGm();
  const d = dayOf(SAVE.gm);
  if (SAVE.dayRolled !== d) {   // a new real day since the last roll, including days away
    SAVE.dayRolled = d;
    SAVE.weather = Math.random() < TUNE.rainChance ? 'rain' : 'clear';
  }
  if (S.shake > 0) S.shake -= dt;
  tickDinner();

  switch (S.state) {
    case 'charging': {
      const cyc = (S.t / TUNE.chargeTime) % 2;       // up then back down
      S.power = cyc <= 1 ? cyc : 2 - cyc;
      break;
    }
    case 'flying': {
      const k = clamp(S.t / TUNE.flightTime, 0, 1);
      S.bob.x = lerp(S.bob.sx, S.bob.tx, k);
      S.bob.y = lerp(S.bob.sy, 102, k) - Math.sin(k * Math.PI) * (16 + S.power * 18);
      if (k >= 1) { S.bob.y = 102; splash(S.bob.x, 102, 6); startWaiting(); }
      break;
    }
    case 'waiting': {
      const sh = S.shadow;
      if (S.t > S.waitAt - 3) sh.show = true;
      if (sh.show) {
        const k = clamp((S.t - (S.waitAt - 3)) / 3, 0, 1);
        sh.cx = lerp(sh.x, S.bob.x - sh.w / 2, k);
      }
      for (const n of S.nibbles) if (S.t >= n && S.t - dt < n) S.lastNibble = S.t;
      if (S.t >= S.waitAt) { setState('bite'); splash(S.bob.x, 102, 4); }
      break;
    }
    case 'bite':
      if (S.t > TUNE.biteWindow) say('Too slow. It stole the bait.', 1.6);
      break;
    case 'reeling': {
      const f = S.fish;

/* ---------- Journal ---------- */
function openJournal(detailId) {
  S.holding = false;

  $('journal').hidden = false;
  renderJournal();
  if (detailId) showDetail(detailId);

}
function closeJournal() {
  if (!$('journalDetail').hidden) { $('journalDetail').hidden = true; $('journalGrid').hidden = false; return; }
  $('journal').hidden = true;
}
function renderJournal() {
  const n = FISH.filter(f => isFish(f) && SAVE.found[f.id]).length;
  const odds = FISH.filter(f => f.junk && SAVE.found[f.id]).length;
  const daily = FISH.find(f => f.id === DAILY);
  $('journalSub').textContent = n + ' of ' + FISH_COUNT() + ' fish' + (odds ? ' · ' + odds + ' odds and ends' : '') + ' · today\'s fish: ' + (SAVE.found[daily.id] ? daily.name : daily.hint);
  const grid = $('journalGrid'); grid.innerHTML = '';
  $('journalDetail').hidden = true; grid.hidden = false;
  for (const f of FISH) {
    const rec = SAVE.found[f.id];
    const no = f.junk ? 'Odds and Ends' : 'No. ' + String(f.id).padStart(3, '0');
    if (f.chest && !rec && (SAVE.mapPieces || 0) < 4) continue;   // the chest stays a secret until the map is whole
    if (rec) {
      const b = document.createElement('button'); b.className = 'slot' + (f.junk ? ' odd' : '');
      b.innerHTML = '<div class="mini">sketch</div><span class="no"></span><span class="nm"></span>';
      b.querySelector('.no').textContent = no; b.querySelector('.nm').textContent = f.name;
      fillSketch(b.querySelector('.mini'), f, 'sketch');
      if (rec.gold) { const g = document.createElement('span'); g.className = 'goldmark'; g.textContent = '★'; g.title = 'Golden one caught'; b.appendChild(g); }
      b.addEventListener('click', () => showDetail(f.id));
      grid.appendChild(b);
    } else {
      const d = document.createElement('div'); d.className = 'slot missing' + (f.junk ? ' odd' : '');
      d.innerHTML = '<span class="q" aria-hidden="true">?</span><span class="no"></span><span class="hint"></span>';
      d.querySelector('.no').textContent = no; d.querySelector('.hint').textContent = f.hint;
      grid.appendChild(d);
    }
  }
}

  const f = FISH.find(x => x.id === id), rec = SAVE.found[id];
  if (!rec) return;
  const el = $('journalDetail'); el.innerHTML = '';
  const add = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; el.appendChild(e); return e; };
  add('div', 'small', f.junk ? 'Odds and Ends' : 'No. ' + String(f.id).padStart(3, '0') + ' · ' + f.rarity).style.color = 'var(--muted)';
  fillSketch(add('div', 'sketch'), f, '[Drawing of ' + f.name + ' coming soon]');
  add('h2', 'fishname', f.name);
  const facts = add('div', 'facts');
  (f.junk ? [(f.map ? 'Pieces ' + (SAVE.mapPieces || 0) + ' of 4' : null), 'Found ' + rec.n + (rec.n === 1 ? ' time' : ' times'), 'First ' + rec.first].filter(Boolean) : ['Best ' + rec.best + ' cm', 'Caught ' + rec.n + (rec.n === 1 ? ' time' : ' times'), 'First ' + rec.first]).forEach(t => { const s = document.createElement('span'); s.textContent = t; facts.appendChild(s); });
  add('p', 'note', f.note);
  if (f.id === 101 && SAVE.bottleNote) add('p', 'note', 'Latest note: "' + SAVE.bottleNote + '"');
  if (f.map && (SAVE.mapPieces || 0) >= 4) add('p', 'note', 'The X is far out past the pier. Cast far.');
  if (f.junk) { $('journalGrid').hidden = true; el.hidden = false; return; }
  add('div', 'fightnote', 'How it fights: ' + FIGHTS[f.fight || 'steady']);
  if (rec.gold) {
    add('div', 'small', 'Golden one · caught ' + rec.gold + (rec.gold === 1 ? ' time' : ' times')).style.color = '#a87a12';
    const g = add('div', 'sketch small-sketch');
    fillSketch(g, f, '', true);
  } else add('div', 'small', 'Golden one: not yet. Watch for a gold shimmer in the water.').style.color = 'var(--muted)';
  $('journalGrid').hidden = true; el.hidden = false;
}
$('journalBtn').addEventListener('click', () => openJournal());
$('journalBack').addEventListener('click', closeJournal);
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('journal').hidden) closeJournal(); });

/* ---------- Debug (?debug) ---------- */
if (new URLSearchParams(location.search).has('debug')) {
  const dbg = $('debug'); dbg.hidden = false;
  const mk = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', fn); dbg.appendChild(b); };
  const setHour = hh => { setClockHour(hh); SAVE.gm = clockGm(); };
  mk('6am', () => setHour(6)); mk('noon', () => setHour(12)); mk('6pm', () => setHour(18)); mk('10pm', () => setHour(22));
  mk('rain', () => { SAVE.weather = SAVE.weather === 'rain' ? 'clear' : 'rain'; });
  mk('bite now', () => { if (S.state === 'waiting') S.waitAt = S.t; });
  mk('reset', () => { SAVE = freshSave(); persist(); updateFound(); });
}

/* ---------- Loop ---------- */
let last = performance.now(), saveTimer = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const paused = !$('journal').hidden;
  if (!paused) update(dt);
  draw();
  updateHud();
  saveTimer += dt; if (saveTimer > 5) { saveTimer = 0; persist(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
updateFound();
requestAnimationFrame(frame);

/* ---------- Playtest hooks ---------- */
window.__tb = {
  S, TUNE, FISH,
  get save() { return SAVE; },
  press, release,
  setHour(hh) { setClockHour(hh); SAVE.gm = clockGm(); },
  setWeather(w) { SAVE.weather = w; },
  reset() { SAVE = freshSave(); persist(); updateFound(); },
  closeCard() { $('catchOverlay').hidden = true; setState('idle'); },
  catPose, dinnerOpen,
};
</script>
